<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B4DCYBER PDF Tool</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://unpkg.com/docx@9.5.1/build/index.umd.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0b1020;color:#e8eefc}
.app{min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 24px;border-bottom:1px solid #26304a;background:#11182b;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-size:22px;font-weight:700}.sub{font-size:12px;color:#91a0bf;margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.file-label{border:1px solid #35415f;background:#1a2440;color:#e8eefc;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:600}
button:hover,.file-label:hover{background:#253254}button.primary,.file-label.primary{background:#315ee7;border-color:#315ee7}
input[type=file]{display:none}.layout{display:grid;grid-template-columns:260px 1fr;flex:1;min-height:0}
.sidebar{padding:18px;border-right:1px solid #26304a;background:#0f1628}.sidebar h3{margin:0 0 14px}.tool{width:100%;margin:5px 0;text-align:left}
.workspace{display:flex;flex-direction:column;min-width:0}.toolbar{padding:12px 16px;border-bottom:1px solid #26304a;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.status{font-size:13px;color:#9eacc8;margin-left:auto}.preview{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start;background:#080c17}
.page-wrap{background:white;box-shadow:0 8px 30px #0008;position:relative}.page-wrap canvas{display:block;max-width:min(900px,90vw);height:auto}
.empty{text-align:center;color:#71809e;margin-top:20vh}.page-info{padding:8px 12px;text-align:center;color:#9eacc8;border-top:1px solid #26304a}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.dialog{width:min(900px,96vw);max-height:90vh;overflow:auto;background:#11182b;border:1px solid #34405d;border-radius:12px;padding:20px}
.dialog h2{margin-top:0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{padding:10px;border-radius:8px;border:1px solid #35415f;background:#0b1020;color:#fff}
textarea{width:100%;min-height:300px;background:#080c17;color:#dce7ff;border:1px solid #35415f;border-radius:8px;padding:12px;font-family:Consolas,monospace}
.progress{height:8px;background:#27324c;border-radius:10px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:#4e78ff}
@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid #26304a}.status{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div><div class="brand">B4DCYBER PDF TOOL</div><div class="sub">Browser-based PDF utilities • client-side document processing</div></div>
<div class="actions"><label class="file-label primary">Open PDF<input id="pdfInput" type="file" accept=".pdf,application/pdf"></label><label class="file-label">OCR Image<input id="imageInput" type="file" accept="image/*"></label></div>
</header>
<div class="layout">
<aside class="sidebar">
<h3>PDF Operations</h3>
<button class="tool" id="mergeBtn">Merge PDFs</button>
<button class="tool" id="extractBtn">Extract Pages</button>
<button class="tool" id="deleteBtn">Delete Pages</button>
<button class="tool" id="rotateBtn">Rotate Current Page</button>
<button class="tool" id="wordBtn">PDF → Word</button>
<button class="tool" id="ocrPdfBtn">OCR Current PDF Page</button>
</aside>
<main class="workspace">
<div class="toolbar">
<button id="prevBtn">← Previous</button><button id="nextBtn">Next →</button>
<button id="zoomOut">−</button><button id="zoomIn">+</button><button id="downloadBtn" class="primary">Save PDF</button>
<span class="status" id="status">Ready</span>
</div>
<div class="preview" id="preview"><div class="empty" id="empty">Open a PDF to preview it here.</div><div class="page-wrap" id="pageWrap" style="display:none"><canvas id="pdfCanvas"></canvas></div></div>
<div class="page-info" id="pageInfo">No PDF loaded</div>
</main>
</div>
</div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="row" style="margin-top:15px;justify-content:flex-end"><button id="closeModal">Close</button></div></div></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
var PDFDocument=PDFLib.PDFDocument, degrees=PDFLib.degrees;
var originalBytes=null,pdfDoc=null,currentPage=1,zoom=1.25,currentRenderedPage=null;
function $(id){return document.getElementById(id)} function status(t){$("status").textContent=t}
function setModal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.add("show")}
$("closeModal").onclick=function(){$("modal").classList.remove("show")};
function downloadBytes(bytes,name,type){var blob=new Blob([bytes],{type:type||"application/pdf"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
async function loadPdf(bytes){originalBytes=bytes;pdfDoc=await PDFDocument.load(bytes);currentPage=1;zoom=1.25;await renderPage();status("PDF loaded")}
async function renderPage(){
 if(!originalBytes)return;
 var loading=await pdfjsLib.getDocument({data:originalBytes.slice(0)}).promise;
 currentRenderedPage=await loading.getPage(currentPage);
 var viewport=currentRenderedPage.getViewport({scale:zoom}),c=$("pdfCanvas"),ctx=c.getContext("2d");
 c.width=viewport.width;c.height=viewport.height;
 await currentRenderedPage.render({canvasContext:ctx,viewport:viewport}).promise;
 $("empty").style.display="none";$("pageWrap").style.display="block";
 $("pageInfo").textContent="Page "+currentPage+" / "+loading.numPages;
}
$("pdfInput").onchange=async function(e){var f=e.target.files[0];if(!f)return;status("Loading PDF...");try{await loadPdf(new Uint8Array(await f.arrayBuffer()))}catch(err){alert(err.message);status("Error")}};
$("prevBtn").onclick=async function(){if(pdfDoc&&currentPage>1){currentPage--;await renderPage()}};
$("nextBtn").onclick=async function(){if(pdfDoc&&currentPage<pdfDoc.getPageCount()){currentPage++;await renderPage()}};
$("zoomIn").onclick=async function(){zoom=Math.min(3,zoom+.2);if(pdfDoc)await renderPage()};
$("zoomOut").onclick=async function(){zoom=Math.max(.5,zoom-.2);if(pdfDoc)await renderPage()};
$("downloadBtn").onclick=async function(){if(!pdfDoc)return alert("Open a PDF first.");status("Preparing PDF...");downloadBytes(await pdfDoc.save(),"B4DCYBER-edited.pdf");status("Saved")};

$("mergeBtn").onclick=function(){
 setModal("Merge PDFs","<p>Select two or more PDF files. They are processed in your browser.</p><input class='field' id='mergeFiles' type='file' accept='.pdf,application/pdf' multiple><div style='margin-top:12px'><button id='doMerge' class='primary'>Merge & Download</button></div>");
 $("doMerge").onclick=async function(){var fs=Array.from($("mergeFiles").files);if(fs.length<2)return alert("Select at least two PDFs.");status("Merging...");try{var out=await PDFDocument.create();for(var i=0;i<fs.length;i++){var src=await PDFDocument.load(await fs[i].arrayBuffer()),pages=await out.copyPages(src,src.getPageIndices());pages.forEach(function(p){out.addPage(p)})}downloadBytes(await out.save(),"B4DCYBER-merged.pdf");status("Merge complete");$("modal").classList.remove("show")}catch(e){alert(e.message);status("Merge error")}};
};
function parseRange(s,total){if(!s.trim())throw Error("Enter page numbers.");var set=new Set();s.split(",").forEach(function(raw){var x=raw.trim();if(!x)return;if(x.indexOf("-")>=0){var ab=x.split("-").map(Number),a=ab[0],b=ab[1];if(!Number.isInteger(a)||!Number.isInteger(b))throw Error("Invalid range.");for(var i=Math.min(a,b);i<=Math.max(a,b);i++)if(i>=1&&i<=total)set.add(i-1)}else{var n=Number(x);if(!Number.isInteger(n)||n<1||n>total)throw Error("Page number out of range.");set.add(n-1)}});if(!set.size)throw Error("No valid pages selected.");return Array.from(set).sort(function(a,b){return a-b})}
function pageDialog(title,action){if(!pdfDoc)return alert("Open a PDF first.");setModal(title,"<p>Total pages: <b>"+pdfDoc.getPageCount()+"</b></p><input class='field' id='pageRange' placeholder='Example: 1-3,5,8'><div style='margin-top:12px'><button id='doPages' class='primary'>Continue</button></div>");$("doPages").onclick=async function(){try{var pages=parseRange($("pageRange").value,pdfDoc.getPageCount());await action(pages)}catch(e){alert(e.message)}}}
$("extractBtn").onclick=function(){pageDialog("Extract Pages",async function(pages){var out=await PDFDocument.create(),copied=await out.copyPages(pdfDoc,pages);copied.forEach(function(p){out.addPage(p)});downloadBytes(await out.save(),"B4DCYBER-extracted.pdf");$("modal").classList.remove("show");status("Pages extracted")})};
$("deleteBtn").onclick=function(){pageDialog("Delete Pages",async function(pages){if(pages.length>=pdfDoc.getPageCount())throw Error("At least one page must remain.");var remove=new Set(pages),keep=[];for(var i=0;i<pdfDoc.getPageCount();i++)if(!remove.has(i))keep.push(i);var out=await PDFDocument.create(),copied=await out.copyPages(pdfDoc,keep);copied.forEach(function(p){out.addPage(p)});pdfDoc=out;originalBytes=await out.save();currentPage=Math.min(currentPage,pdfDoc.getPageCount());await renderPage();$("modal").classList.remove("show");status("Pages deleted")})};
$("rotateBtn").onclick=async function(){if(!pdfDoc)return alert("Open a PDF first.");var p=pdfDoc.getPage(currentPage-1);p.setRotation(degrees((p.getRotation().angle+90)%360));originalBytes=await pdfDoc.save();await renderPage();status("Current page rotated 90 degrees")};
$("wordBtn").onclick=async function(){
 if(!pdfDoc)return alert("Open a PDF first.");status("Extracting text...");
 try{var src=await pdfjsLib.getDocument({data:originalBytes.slice(0)}).promise,textPages=[];
 for(var i=1;i<=src.numPages;i++){var p=await src.getPage(i),tc=await p.getTextContent();textPages.push(tc.items.map(function(x){return x.str}).join(" "))}
 var children=textPages.map(function(t,i){return new docx.Paragraph({children:[new docx.TextRun(t||"")],pageBreakBefore:i>0})});
 var d=new docx.Document({sections:[{properties:{},children:children}]}),blob=await docx.Packer.toBlob(d),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="B4DCYBER-converted.docx";a.click();status("Word document created")
 }catch(e){alert(e.message);status("Conversion error")}
};
$("imageInput").onchange=async function(e){var f=e.target.files[0];if(!f)return;setModal("Image OCR","<p id='ocrMsg'>OCR is running in your browser.</p><div class='progress'><div class='bar' id='ocrBar'></div></div><textarea id='ocrText' placeholder='Recognized text will appear here...'></textarea><div style='margin-top:10px'><button id='copyOcr'>Copy Text</button></div>");try{var worker=await Tesseract.createWorker("eng",{logger:function(m){if(m.progress)$("ocrBar").style.width=(m.progress*100)+"%";if(m.status)$("ocrMsg").textContent=m.status}}),r=await worker.recognize(await f.arrayBuffer());$("ocrText").value=r.data.text;await worker.terminate();status("OCR complete");$("copyOcr").onclick=function(){navigator.clipboard.writeText($("ocrText").value)}}catch(err){$("ocrMsg").textContent="OCR error: "+err.message}};
$("ocrPdfBtn").onclick=async function(){if(!currentRenderedPage)return alert("Open a PDF first.");setModal("PDF Page OCR","<p id='pdfOcrMsg'>Rendering and recognizing current page...</p><div class='progress'><div class='bar' id='pdfOcrBar'></div></div><textarea id='pdfOcrText' placeholder='Recognized text...'></textarea>");try{var viewport=currentRenderedPage.getViewport({scale:2}),c=document.createElement("canvas");c.width=viewport.width;c.height=viewport.height;await currentRenderedPage.render({canvasContext:c.getContext("2d"),viewport:viewport}).promise;var worker=await Tesseract.createWorker("eng",{logger:function(m){if(m.progress)$("pdfOcrBar").style.width=(m.progress*100)+"%";if(m.status)$("pdfOcrMsg").textContent=m.status}}),r=await worker.recognize(c);$("pdfOcrText").value=r.data.text;await worker.terminate();status("PDF OCR complete")}catch(err){$("pdfOcrMsg").textContent="OCR error: "+err.message}};
</script>
</body>
</html>
